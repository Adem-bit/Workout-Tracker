<h1>My Calisthenics Journey</h1>

<a href="/add">➕ Add New Workout</a>
<a href="/prs">🏆 View Personal Records</a>
<a href="/export">
    <button type="button" class="export-btn">📥 Export CSV</button>
</a>

<br><br>

<form method="GET" action="/" style="margin-bottom: 1rem;">
    <label for="filter">Filter by exercise:</label>
    <select name="exercise" id="filter" onchange="this.form.submit()">
        <option value="">-- Show All --</option>
        {% for ex in exercises %}
            <option value="{{ ex }}" {% if ex == current_filter %}selected{% endif %}>{{ ex }}</option>
        {% endfor %}
    </select>
    {% if current_filter %}
        <a href="/">✕ Clear Filter</a>
    {% endif %}
</form>

<hr>
